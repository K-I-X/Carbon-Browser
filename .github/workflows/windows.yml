# Builds Carbon for Windows on every push to main. A pushed commit with [release] in its message also publishes the
# installer as the GitHub Release v<Version> (from carbon/Carbon.csproj), which Carbon's updater reads.
name: Windows

on:
  push:
    branches: [main]
    paths: ["carbon/**", "installer/**", "launcher/**", ".github/workflows/windows.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach again (empty builds main and attaches nothing)
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Launcher
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cd launcher
          cl /nologo /O1 /MT /W3 CarbonOpen.c /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib shlwapi.lib advapi32.lib
      - name: App
        run: dotnet publish carbon/Carbon.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -o artifacts/Carbon -nologo
      - name: Installer
        shell: pwsh
        run: |
          # Inno Setup 7.1.0 and Microsoft's WebView2 bootstrapper, each checked before use.
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile "$env:RUNNER_TEMP\inno.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP\inno.exe" -Algorithm SHA256).Hash -ne "0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F") { throw "Inno Setup download doesn't match" }
          Start-Process "$env:RUNNER_TEMP\inno.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$env:RUNNER_TEMP\Inno7" -Wait
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile tools\MicrosoftEdgeWebview2Setup.exe
          $sig = Get-AuthenticodeSignature tools\MicrosoftEdgeWebview2Setup.exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { throw "WebView2 bootstrapper signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          $version = [regex]::Match((Get-Content carbon\Carbon.csproj -Raw), "<Version>(.+?)</Version>").Groups[1].Value
          & "$env:RUNNER_TEMP\Inno7\ISCC.exe" /Q "/DAppVersion=$version" "/DAppExe=$PWD\artifacts\Carbon\Carbon.exe" "/DLauncherExe=$PWD\launcher\CarbonOpen.exe" "/DOutputRoot=$PWD\artifacts" "/DBootstrapper=$PWD\tools\MicrosoftEdgeWebview2Setup.exe" installer\Carbon.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
          Copy-Item "artifacts\Carbon-Setup-$version-x64.exe" artifacts\Carbon-Setup-x64.exe
          Get-FileHash artifacts\Carbon-Setup-x64.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Carbon-windows
          path: artifacts/Carbon-Setup-x64.exe
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        run: gh release upload "$env:TAG" artifacts/Carbon-Setup-x64.exe --clobber --repo "$env:GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Publish a release ([release] in the commit message)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content carbon\Carbon.csproj -Raw), "<Version>(.+?)</Version>").Groups[1].Value
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag artifacts/Carbon-Setup-x64.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Carbon $version" --notes "Download **Carbon-Setup-x64.exe** below and run it (Windows 10 and 11, 64-bit). Carbon isn't code-signed yet, so Windows SmartScreen may warn: choose More info, then Run anyway. Carbon updates itself after that."
          } else {
            gh release upload $tag artifacts/Carbon-Setup-x64.exe --clobber --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE) { throw "Publishing the release failed" }
        env:
          GH_TOKEN: ${{ github.token }}
