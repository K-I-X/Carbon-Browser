# Run by hand (Actions > Delete releases > Run workflow): deletes the releases named, with their tags. For releases
# published by mistake, so Carbon's updater stops offering them.
name: Delete releases

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Release tags to delete, separated by spaces (like v1.0.1 v1.0.2)
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          for tag in $TAGS; do
            case "$tag" in v[0-9]*) ;; *) echo "Skipping $tag: not a version tag"; continue ;; esac
            gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" && echo "Deleted $tag"
          done
